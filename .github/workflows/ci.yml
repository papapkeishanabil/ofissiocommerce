name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      PRODUCT_SOURCE: mock
      WOOCOMMERCE_ENABLED: "false"
      WOOCOMMERCE_SYNC_ORDERS: "false"
      PAYMENT_PROVIDER: mock
      SHIPPING_PROVIDER: mock
      DEFAULT_ORIGIN_CITY: Bandung
      LOG_LEVEL: info
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
